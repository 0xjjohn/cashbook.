/* Layout: one RTL column. A ruled-notebook hero carries the remaining balance; five-tab bar pinned to the bottom. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F2F2F2; --ink:#000000; --muted:#595959;
  --line:#CFCFCF; --accent:#000000; --accent-ink:#FFFFFF; --accent-soft:#E6E6E6;
  --warn:#000000; --warn-soft:#EDEDED; --bad:#000000; --bad-soft:#E0E0E0;
  --needs:#000000; --wants:#6B6B6B; --save:#A6A6A6; --free:#DADADA;
  --rule:#EDEDED; --margin:#9A9A9A; --scrim:rgba(0,0,0,.5); --money:#12803A; --c-red:#D92D20; --c-blue:#1D5FD0;
  --f-display:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans Arabic',Tahoma,sans-serif;
  --f-body:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans Arabic',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0B0B0B; --surface2:#1A1A1A; --ink:#FFFFFF; --muted:#A6A6A6;
  --line:#363636; --accent:#FFFFFF; --accent-ink:#000000; --accent-soft:#2A2A2A;
  --warn:#FFFFFF; --warn-soft:#262626; --bad:#FFFFFF; --bad-soft:#333333;
  --needs:#FFFFFF; --wants:#9A9A9A; --save:#5E5E5E; --free:#2B2B2B;
  --rule:#171717; --margin:#666666; --scrim:rgba(0,0,0,.7); --money:#4ADE80; --c-red:#F0443A; --c-blue:#4A8CF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0B0B0B; --surface2:#1A1A1A; --ink:#FFFFFF; --muted:#A6A6A6;
  --line:#363636; --accent:#FFFFFF; --accent-ink:#000000; --accent-soft:#2A2A2A;
  --warn:#FFFFFF; --warn-soft:#262626; --bad:#FFFFFF; --bad-soft:#333333;
  --needs:#FFFFFF; --wants:#9A9A9A; --save:#5E5E5E; --free:#2B2B2B;

  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin-inline:auto;padding-inline:16px;padding-block:12px 112px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;font-weight:600}
.u{font-size:.78em;color:var(--muted);font-weight:500}
.n.m{color:var(--money)!important}
#salary,#extra,#qAmount,#f_amount,#cLim,.catedit .ce-lim{color:var(--money);font-weight:600}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:4px 12px}
.topr{display:flex;align-items:center;gap:10px;min-width:0}
.themebtn{min-width:34px;width:34px;padding:0;display:grid;place-items:center}
.themebtn svg{width:18px;height:18px}
.langbtn{min-height:34px;min-width:52px;padding:2px 14px;border:1.5px solid var(--ink);border-radius:17px;font-weight:700;font-size:13px;text-align:center;background:var(--surface)}
.brand{font-family:'Zaatar Black',var(--f-display);font-weight:400;font-size:48px;line-height:1.5;padding-top:26px;direction:rtl;unicode-bidi:isolate;white-space:nowrap}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--free);flex:none}
.sync.cloud::before{background:var(--accent)}
.sync.err::before{background:var(--bad)}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.monthnav .lbl{font-family:var(--f-display);font-weight:700;font-size:20px}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}

.hero{position:relative;background-color:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px 18px;padding-inline-start:62px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-position:0 8px}
.hero::before{content:"";position:absolute;inset-block:0;inset-inline-start:44px;width:1px;background:var(--margin)}
.hero .k{font-size:14px;color:var(--muted)}
.hero .big{font-size:40px;line-height:1.3;font-weight:700;margin-block:2px 4px}
.hero .big .u{font-size:.4em}
.hero .big.bad{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.hero .sub{font-size:14px;color:var(--muted)}
.hero .sub .n{color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px}
.card h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0 0 10px;text-wrap:balance}
.card h2 small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);margin-inline-start:6px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.link{color:var(--accent);font-weight:600;font-size:14px;padding:4px 0}

.alloc{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--free);margin-block:14px 10px}
.alloc i{display:block;height:100%}
.p1{background:var(--ink)}
.p2{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,var(--surface) 3px 6px)}
.p3{background:radial-gradient(var(--ink) 1.3px,transparent 1.8px) 0 0/5px 5px,var(--surface)}
.p4{background:var(--free)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:7px;min-width:0}
.legend i{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid var(--ink)}
.legend span.t{color:var(--muted)}
.legend .n{margin-inline-start:auto;font-size:13.5px}

.notes{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.spot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.spot small{font-size:12.5px;color:var(--muted)}
.spot b{font-family:var(--f-display);font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.spot .n.m{font-size:20px;font-weight:700}
.sp-bar{height:6px;border-radius:3px;background:var(--free);margin-top:6px;overflow:hidden}
.sp-bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.spot .meta .n{color:var(--ink)}
.spot.one{margin-top:14px;gap:6px;padding:14px}
.spot.one .sp-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.spot.one .sp-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.spot.one .sp-name b{font-size:19px}
.spot.one .sp-name .meta{font-size:13.5px}
.spot.one .n.m{font-size:22px;flex:none}
.notes.insights{margin-top:14px}
.notes.insights .note{padding:12px 14px;line-height:1.7}
.notes.insights .note .n{color:inherit;font-weight:700}
.note{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--surface2)}
.note.bad{background:var(--surface);color:var(--ink);border:2px solid var(--ink);font-weight:600}
.note.warn{background:var(--surface);color:var(--ink);border:1.5px dashed var(--ink)}
.note .n{color:inherit}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding-block:11px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.rowmain{flex:1;min-width:0;display:flex;flex-direction:column;text-align:start}
.rowmain b{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.meta.bad{color:var(--ink);font-weight:700;text-decoration:underline}
.meta.ok{color:var(--ink);font-weight:700}
.amt{text-align:end;flex:none}
.amt small{display:block;font-size:12px;color:var(--muted)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface)}
.check svg{width:16px;height:16px}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--free);position:relative;flex:none;border:1.5px solid var(--muted)}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{inset-inline-start:21px}
.off{opacity:.55}

.meter{height:10px;border-radius:5px;background:var(--free);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--wants)}
.meter.warn i{background:repeating-linear-gradient(135deg,var(--ink) 0 4px,var(--wants) 4px 8px)}
.meter.bad i{background:var(--ink)}
.meter.save i{background:radial-gradient(var(--ink) 1.3px,transparent 1.8px) 0 0/5px 5px,var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.catrow{padding-block:10px;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.catrow .h b{font-weight:600}
.catrow .h span{font-size:13px;color:var(--muted)}
.catrow .h span .n{color:var(--ink);font-size:13px}
.catrow .h span .n.bad{text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding-inline:18px;border-radius:10px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.addbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}

.sumline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.sumline div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.sumline small{display:block;font-size:12.5px;color:var(--muted)}
.sumline .n{font-size:17px}

.empty{text-align:center;color:var(--muted);padding:22px 8px}
.empty p{margin:0 0 12px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13.5px;color:var(--muted)}
.inp{width:100%;min-height:46px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.err{color:var(--bad);font-size:13.5px;min-height:1.4em;margin:6px 0 0}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:40px;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface2);font-weight:500;font-size:14.5px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.static{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.hint{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.limitrow{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:6px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.limitrow:first-of-type{border-top:0}
.catedit{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:8px 10px;align-items:start;padding-block:10px;border-top:1px solid var(--line)}
.catedit:first-of-type{border-top:0}
.catedit .ce-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.catedit .ce-main small{font-size:12.5px;color:var(--muted)}
.catedit .ce-name{font-weight:600}
.catedit .ce-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.catedit .ce-grp{min-height:30px;max-width:100%;padding:2px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:12.5px}
.catform .cf-r2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.catedit .ce-lim{text-align:end;direction:ltr;font-variant-numeric:tabular-nums}
.catedit .btn.sure{min-height:40px;padding-inline:12px;font-size:13px}
.catform{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;margin-top:16px}
.catform .err{grid-column:1/-1;margin:0;min-height:0}
.catform #cLim{text-align:end;direction:ltr}
.qf{display:grid;gap:10px}
.qf .r1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.qf .r2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.qf .err{min-height:0;margin:0}
.tot{margin:16px 2px 4px;align-items:center}
.limitrow .nm{font-weight:600}
.limitrow .nm small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.limitrow .inp{min-height:40px;text-align:end;direction:ltr;font-variant-numeric:tabular-nums}
.limitrow .meter{grid-column:1/-1}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;padding-top:8px;font-size:14px;color:var(--muted);border-top:2px solid var(--line)}
.ghead b{color:var(--ink);font-family:var(--f-display);font-size:16px}
.ghead:first-of-type{border-top:0;margin-top:0;padding-top:0}

.remrow{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:start;min-width:0}
.remrow svg{width:20px;height:20px;flex:none}
.remrow .rr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.remrow .rr-t b{font-weight:600}
.remnotes{margin-top:0;margin-bottom:12px}
.rembills{margin-top:6px}
.rembills .rb{padding:10px 0;border-top:1px solid var(--line)}
.rembills .rb:first-child{border-top:0}
.rembills .rb b{display:block;margin-bottom:6px;font-weight:600}
.rembills .pill{display:inline-flex;align-items:center;min-height:36px;padding:4px 12px;font-size:13.5px;text-decoration:none;color:var(--ink)}
.sheet .sub{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.sheet h4{font-family:var(--f-display);font-size:16px;margin:18px 0 4px}
.plansum{margin-top:12px}
.plansum .over{border:2px solid var(--ink)}
.plansum .over small{color:var(--ink);font-weight:700}
.steps{counter-reset:st}
.step h2{display:flex;align-items:center;gap:10px}
.step h2::before{counter-increment:st;content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-size:14px;font-weight:700;display:grid;place-items:center}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.plancard{text-align:start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:3px;min-height:68px;min-width:0}
.plancard b{font-weight:600;font-size:15px}
.plancard small{font-size:12.5px;color:var(--muted);line-height:1.4}
.plancard[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plancard[aria-pressed="true"] small{color:inherit;opacity:.85}
.ghead2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:18px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.ghead2 b{font-family:var(--f-display);font-size:16px}
.ghead2 .n{font-size:13px}
.crow{padding-block:12px;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:0}
.cr-top{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:10px;align-items:center;margin-bottom:8px}
.cr-name{text-align:start;min-height:40px;min-width:0;overflow-wrap:anywhere}
.cr-name b{font-weight:600;border-bottom:1px dashed var(--muted)}
.cr-lim{min-height:40px;text-align:end;direction:ltr;font-variant-numeric:tabular-nums}
.cr-meta{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.cr-edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px;padding:12px;border-radius:10px;background:var(--surface2)}
.cr-edit .inp{background:var(--surface)}
.cr-acts{grid-column:1/-1;display:flex;gap:10px}
.cr-acts .btn{flex:1;min-height:40px}
.cf-title{grid-column:1/-1;font-family:var(--f-display);font-weight:700}
/* plan: minimal */
.ps{margin-top:26px}
.ps:first-child,.banner+.ps{margin-top:12px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lname{text-align:start;min-height:42px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.lname small{font-weight:600;font-size:12.5px}
.lname small.bad{text-decoration:underline}
.lrow .lim{min-height:42px;text-align:end;direction:ltr;font-variant-numeric:tabular-nums}
.lx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;margin-bottom:6px;border-radius:10px;background:var(--surface2)}
.lx .inp{background:var(--surface)}
.lx-acts{grid-column:1/-1;display:flex;gap:10px}
.lx-acts .btn{flex:1;min-height:40px}
.ltotal{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:12px;border-top:2px solid var(--ink);font-weight:700}
.addlink{display:inline-flex;align-items:center;gap:6px;margin-top:14px;min-height:40px;font-weight:600;color:var(--accent)}
.addlink svg{width:16px;height:16px}
.dataps{padding-top:16px;border-top:1px solid var(--line)}
.acc{padding:0;overflow:hidden}
.acc-h{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:12px 16px;font-family:var(--f-display);font-weight:700;font-size:17px;text-align:start}
.acc-h svg{width:20px;height:20px;flex:none;color:var(--muted);transition:transform .2s}
.acc-h[aria-expanded="true"] svg{transform:rotate(180deg)}
.acc-b{padding:0 16px 14px;border-top:1px solid var(--line)}
.acc-b[hidden]{display:none}
.srow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.srow .sl{color:var(--muted);display:flex;flex-direction:column;gap:1px}
.srow .sl small{font-size:12.5px}
.srow .n.m{font-size:17px;font-weight:700}
.tb{padding-top:12px;display:flex;flex-direction:column;gap:6px}
.tb .tl{font-size:12.5px;color:var(--muted)}
.tb .sp-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tb .sp-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.tb .sp-name b{font-size:18px}
.tb .n.m{font-size:21px;font-weight:700;flex:none}
@media (prefers-reduced-motion:reduce){.acc-h svg{transition:none}}
.acc-v{margin-inline-start:auto;font-family:var(--f-body);font-weight:600;font-size:14px;color:var(--muted)}
.plist{display:flex;flex-direction:column}
.popt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:start;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px}
.popt .pn{display:flex;flex-direction:column;gap:2px;min-width:0}
.popt .pn b{font-size:16px}
.popt .pn small{font-size:13px;color:var(--muted)}
.popt .pn .pd{font-size:12.5px}
.popt .pc{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.popt.on .pc{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.popt .pc svg{width:14px;height:14px}
.pamt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.pamt div{background:var(--surface2);border-radius:10px;padding:8px 10px;min-width:0}
.pamt small{display:block;font-size:12.5px;color:var(--muted)}
.pamt .n.m{font-size:16px;font-weight:700}
.swap{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;width:92px;height:40px;padding:3px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);flex:none}
.swap .sw-th{position:absolute;inset-block:3px;inset-inline-start:3px;width:calc(50% - 3px);border-radius:999px;background:var(--ink);transition:transform .22s ease}
.swap[data-mode="manual"] .sw-th{transform:translateX(100%)}
:root[dir="rtl"] .swap[data-mode="manual"] .sw-th{transform:translateX(-100%)}
.swap .sw-o{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;color:var(--muted);transition:color .2s}
.swap .sw-o svg{width:19px;height:19px}
.swap .sw-o[aria-pressed="true"]{color:var(--bg)}
.qf.swapin{animation:swapIn .24s ease-out}
@keyframes swapIn{from{opacity:0;transform:translateX(var(--sx,24px))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.qf.swapin{animation:none}.swap .sw-th{transition:none}}
.bk-row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 6px}
.bk-row .btn{flex:1 1 140px}
.bkmsg{margin:8px 0 0;font-size:14px}
.bkmsg.ok{color:var(--money)}
.bkmsg.bad{color:var(--c-red)}
.dataps .banner{margin:10px 0 0}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{padding:8px 4px;min-height:46px;font-size:13px;font-weight:600;line-height:1.3;text-align:center;border-inline-start:1px solid var(--line);overflow-wrap:anywhere}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.s2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.s2 button{font-size:14.5px;min-height:44px}
.chartbox{margin-top:6px}
.cchart{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y;outline-offset:4px}
.cchart .cb{stroke:var(--line);stroke-width:1}
.cchart .ct{fill:var(--muted);font-size:11.5px;font-family:var(--f-body)}
.cchart .bud{stroke:var(--margin);stroke-width:1.2;stroke-dasharray:4 4}
.cchart .bt{fill:var(--muted);font-size:11.5px;font-family:var(--f-body)}
.cchart .cl{fill:none;stroke:var(--c-blue);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cchart .ca{stroke:none}
.cchart .cd{fill:var(--surface);stroke:var(--c-blue);stroke-width:2.2}
.cchart .xh{stroke:var(--muted);stroke-width:1}
.clegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.clegend span{display:inline-flex;align-items:center;gap:7px}
.clegend .k{display:inline-block;width:26px;height:0;border-top:2.5px solid var(--c-blue);border-radius:2px}
.clegend .k.dash{width:26px;border-top:1.5px dashed var(--margin);border-radius:0}
.clegend.two{justify-content:space-between;margin-top:6px}
.chead .big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-.01em}
.chead .big .n{font-size:inherit}
.chead .sub{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;margin:4px 0 10px;font-size:14px;color:var(--muted)}
.chead .dl{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.chead .dl.dn{color:var(--money)}
.chead .dl.up{color:var(--c-red)}
.chead .dl .n{color:inherit!important}
.chead .dl svg{width:10px;height:10px;fill:currentColor}
.cdet{margin-top:12px;font-size:13.5px}
.cdet summary{cursor:pointer;color:var(--muted);min-height:32px;display:flex;align-items:center}
.cdet table{width:100%;border-collapse:collapse;margin-top:6px}
.cdet th{text-align:start;font-weight:600;color:var(--muted);font-size:12.5px;padding:4px 0}
.cdet td{padding:5px 0;border-top:1px solid var(--line)}
.tops{display:flex;flex-direction:column}
.stack{display:flex;gap:2px;height:14px;margin:4px 0 14px}
.stack i{display:block;background:var(--ink);border-radius:3px;min-width:3px}
.tpr{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding-block:11px;min-height:44px}
.sw{flex:none;width:10px;height:10px;border-radius:3px;background:var(--ink)}
.top-items{padding:0 0 12px 0;margin-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.top-items div{display:flex;justify-content:space-between;gap:12px;padding-inline-start:12px;border-inline-start:2px solid var(--line)}
.top-items span{min-width:0;overflow-wrap:anywhere}
.top-items .n{flex:none}
.hb-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.hb-name{font-weight:600;min-width:0;flex:1;overflow-wrap:anywhere}
.hb-val{flex:none;font-size:14px}
.hb-val .meta{font-size:12.5px;margin-inline-start:4px}
.hb-track{height:8px;border-radius:5px;background:var(--free);overflow:hidden}
.hb-track i{display:block;height:100%;background:var(--ink);border-start-end-radius:4px;border-end-end-radius:4px}
.tcols{display:flex;gap:6px;align-items:flex-end}
.tcol{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding:0;min-height:44px}
.tbar{display:block;width:100%;max-width:24px;border-radius:4px 4px 0 0;background:var(--muted);opacity:.55}
.tcol.sel .tbar{background:var(--ink);opacity:1}
.tcol:hover .tbar{opacity:1}
.tlbl{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tcol.sel .tlbl{color:var(--ink);font-weight:700}
.tval{font-size:12px;font-weight:700;color:var(--money);min-height:16px}
.ctip{position:fixed;z-index:40;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;min-width:120px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ctip[hidden]{display:none}
.ctip .tt{font-weight:700;margin-bottom:4px}
.ctip .tr{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}
.ctip .tr .n{color:var(--ink);font-weight:700}
.tstack{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:24px;opacity:.55}
.tcol.sel .tstack,.tcol:hover .tstack{opacity:1}
.tstack i{display:block;min-height:2px}
.tstack .tf{background:var(--muted)}
.tstack .tv{background:var(--ink);border-radius:4px 4px 0 0}
.tstack .tf:last-child{border-radius:4px 4px 0 0}
.sq{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.sq.f{background:var(--muted)}
.sq.v{background:var(--ink)}
.splitrow{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.splitrow span{display:inline-flex;align-items:center;gap:7px}
.splitrow .n{color:var(--money)}
.qf .chips{margin-block:2px}
.qf #qCatNew[hidden]{display:none}
.spform{margin-top:0}
.spform .sec{align-items:center;margin-bottom:12px}
.spform h2{margin:0;font-size:17px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin-inline:-14px;padding:2px 14px 6px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .pill{flex:none}
.qf>.btn{width:100%;min-height:48px}
.qf .err.ok{color:var(--money);font-weight:600}
.qf .err{min-height:1.2em}
.amt-hero{font-size:34px;font-weight:700;text-align:center;direction:ltr;min-height:64px;color:var(--money);background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 8px;font-variant-numeric:tabular-nums}
.amt-hero::placeholder{color:var(--muted);opacity:.6}
.amt-hero:focus{border-color:var(--ink);box-shadow:none}
.splist{margin-top:4px}
.splist .row:first-child{border-top:0}
.splist .dayh{margin-top:18px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.splist .dayh .n{font-size:13px}
.dayh{font-size:13px;color:var(--muted);margin:14px 2px 2px;font-weight:600}
.banner{background:var(--surface2);color:var(--ink);border:1.5px dashed var(--ink);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.banner .btn{min-height:38px;padding-inline:14px;font-size:14px}
.banner .btn.ghost{border-color:currentColor;color:inherit}

.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs-in{max-width:720px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{position:relative;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11.5px;font-weight:500;text-align:center}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto;animation:up .2s ease-out}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0 0 14px}
.sheet .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sheet .acts .btn{flex:1;min-width:110px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.switch::after{transition:none}}
@media (max-width:380px){.hero .big{font-size:34px}.fgrid{grid-template-columns:minmax(0,1fr)}}
</style>
