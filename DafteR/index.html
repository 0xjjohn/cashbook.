/* Layout: one RTL column. A ruled-notebook hero carries the remaining balance; five-tab bar pinned to the bottom. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F2F2F2; --ink:#000000; --muted:#595959;
  --line:#CFCFCF; --accent:#000000; --accent-ink:#FFFFFF; --accent-soft:#E6E6E6;
  --warn:#000000; --warn-soft:#EDEDED; --bad:#000000; --bad-soft:#E0E0E0;
  --needs:#000000; --wants:#6B6B6B; --save:#A6A6A6; --free:#DADADA;
  --rule:#EDEDED; --margin:#9A9A9A; --scrim:rgba(0,0,0,.5); --money:#12803A; --c-red:#D92D20; --c-blue:#1D5FD0;
  --f-display:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Arabic','Noto Sans',sans-serif;
  --f-body:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Arabic','Noto Sans',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0B0B0B; --surface2:#1A1A1A; --ink:#FFFFFF; --muted:#A6A6A6;
  --line:#363636; --accent:#FFFFFF; --accent-ink:#000000; --accent-soft:#2A2A2A;
  --warn:#FFFFFF; --warn-soft:#262626; --bad:#FFFFFF; --bad-soft:#333333;
  --needs:#FFFFFF; --wants:#9A9A9A; --save:#5E5E5E; --free:#2B2B2B;
  --rule:#171717; --margin:#666666; --scrim:rgba(0,0,0,.7); --money:#4ADE80; --c-red:#F0443A; --c-blue:#4A8CF0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0B0B0B; --surface2:#1A1A1A; --ink:#FFFFFF; --muted:#A6A6A6;

}

button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin-inline:auto;padding-inline:16px;padding-block:12px 112px}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;font-weight:600}
.u{font-size:.78em;color:var(--muted);font-weight:500}
.n.m{color:var(--money)!important}
#salary,#extra,#qAmount,#f_amount,#cLim,.catedit .ce-lim{color:var(--money);font-weight:600}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding-block:4px 12px}
.topr{display:flex;align-items:center;gap:10px;min-width:0}
.themebtn{min-width:34px;width:34px;padding:0;display:grid;place-items:center}
.themebtn svg{width:18px;height:18px}
.langbtn{min-height:34px;min-width:52px;padding:2px 14px;border:1.5px solid var(--ink);border-radius:17px;font-weight:700;font-size:0.8125rem;text-align:center;background:var(--surface)}
.brand{font-family:'Zaatar Black',var(--f-display);font-weight:400;font-size:3rem;line-height:1.5;padding-top:26px;direction:rtl;unicode-bidi:isolate;white-space:nowrap}
.sync{font-size:0.75rem;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--free);flex:none}
.sync.cloud::before{background:var(--accent)}
.sync.err::before{background:var(--bad)}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.monthnav .lbl{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}

.hero{position:relative;background-color:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px 18px;padding-inline-start:62px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-position:0 8px}
.hero::before{content:"";position:absolute;inset-block:0;inset-inline-start:44px;width:1px;background:var(--margin)}
.hero .k{font-size:0.875rem;color:var(--muted)}
.hero .big{font-size:2.5rem;line-height:1.3;font-weight:700;margin-block:2px 4px}
.hero .big .u{font-size:.4em}
.hero .big.bad{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.hero .sub{font-size:0.875rem;color:var(--muted)}
.hero .sub .n{color:var(--ink)}
.subbtn{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:start;text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer}
.subbtn .up{display:inline-grid;vertical-align:middle;color:var(--money)}
.subbtn .up svg{width:14px;height:14px}
.subbtn .dim{color:var(--muted)}
.incin{display:flex;align-items:center;gap:10px;margin-top:10px}
.incin .il{flex:0 0 auto;min-width:96px;font-size:0.875rem;color:var(--muted);display:inline-flex;align-items:center}
.incin .up{display:inline-grid;color:var(--money);margin-inline-end:4px}
.incin .up svg{width:16px;height:16px}
.hin{flex:1;min-width:0;min-height:40px;padding:4px 6px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--money);font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.hin::placeholder{color:var(--muted);font-weight:400;opacity:.8}
.hin:focus{outline:none;border-color:var(--ink)}
.subbtn{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:start;text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px}
.card h2{font-family:var(--f-display);font-weight:700;font-size:1.125rem;margin:0 0 10px;text-wrap:balance}
.card h2 small{font-family:var(--f-body);font-weight:400;font-size:0.8125rem;color:var(--muted);margin-inline-start:6px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.link{color:var(--accent);font-weight:600;font-size:0.875rem;padding:4px 0}

.alloc{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--free);margin-block:14px 10px}
.alloc i{display:block;height:100%}
.p1{background:var(--ink)}
.p2{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,var(--surface) 3px 6px)}
.p3{background:radial-gradient(var(--ink) 1.3px,transparent 1.8px) 0 0/5px 5px,var(--surface)}
.p4{background:var(--free)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:0.8125rem}
.legend div{display:flex;align-items:center;gap:7px;min-width:0}
.legend i{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid var(--ink)}
.legend span.t{color:var(--muted)}
.legend .n{margin-inline-start:auto;font-size:0.8438rem}

.notes{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.spot{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:4px}
.spot small{font-size:0.7812rem;color:var(--muted)}
.spot b{font-family:var(--f-display);font-size:1.0625rem;line-height:1.35;overflow-wrap:anywhere}
.spot .n.m{font-size:1.25rem;font-weight:700}
.sp-bar{height:6px;border-radius:3px;background:var(--free);margin-top:6px;overflow:hidden}
.sp-bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.spot .meta .n{color:var(--ink)}
.spot.one{margin-top:14px;gap:6px;padding:14px}
.spot.one .sp-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.spot.one .sp-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.spot.one .sp-name b{font-size:1.1875rem}
.spot.one .sp-name .meta{font-size:0.8438rem}
.spot.one .n.m{font-size:1.375rem;flex:none}
.notes.insights{margin-top:14px}
.notes.insights .note{padding:12px 14px;line-height:1.7}
.notes.insights .note .n{color:inherit;font-weight:700}
.note{font-size:0.875rem;padding:8px 12px;border-radius:8px;background:var(--surface2)}
.note.bad{background:var(--surface);color:var(--ink);border:2px solid var(--ink);font-weight:600}
.note.warn{background:var(--surface);color:var(--ink);border:1.5px dashed var(--ink)}
.note .n{color:inherit}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding-block:11px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.rowmain{flex:1;min-width:0;display:flex;flex-direction:column;text-align:start}
.rowmain b{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:0.8125rem;color:var(--muted)}
.meta.bad{color:var(--ink);font-weight:700;text-decoration:underline}
.meta.ok{color:var(--ink);font-weight:700}
.amt{text-align:end;flex:none}
.amt small{display:block;font-size:0.75rem;color:var(--muted)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent;background:var(--surface)}
.check svg{width:16px;height:16px}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.switch{width:44px;height:26px;border-radius:13px;background:var(--free);position:relative;flex:none;border:1.5px solid var(--muted)}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{inset-inline-start:21px}
.off{opacity:.55}

.meter{height:10px;border-radius:5px;background:var(--free);overflow:hidden}
.meter i{display:block;height:100%;border-radius:5px;background:var(--wants)}
.meter.warn i{background:repeating-linear-gradient(135deg,var(--ink) 0 4px,var(--wants) 4px 8px)}
.meter.bad i{background:var(--ink)}
.meter.save i{background:radial-gradient(var(--ink) 1.3px,transparent 1.8px) 0 0/5px 5px,var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.catrow{padding-block:10px;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.catrow .h b{font-weight:600}
.catrow .h span{font-size:0.8125rem;color:var(--muted)}
.catrow .h span .n{color:var(--ink);font-size:0.8125rem}
.catrow .h span .n.bad{text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding-inline:18px;border-radius:10px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px}
.addbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}



.empty{text-align:center;color:var(--muted);padding:22px 8px}
.empty p{margin:0 0 12px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:0.8438rem;color:var(--muted)}
.inp{width:100%;min-height:46px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .full{grid-column:1/-1}
.err{color:var(--bad);font-size:0.8438rem;min-height:1.4em;margin:6px 0 0}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:40px;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface2);font-weight:500;font-size:0.9062rem}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.static{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.hint{font-size:0.8438rem;color:var(--muted);margin:10px 0 0}
.limitrow{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:6px 12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.limitrow:first-of-type{border-top:0}
.catedit{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:8px 10px;align-items:start;padding-block:10px;border-top:1px solid var(--line)}
.catedit:first-of-type{border-top:0}
.catedit .ce-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.catedit .ce-main small{font-size:0.7812rem;color:var(--muted)}
.catedit .ce-name{font-weight:600}
.catedit .ce-sub{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.catedit .ce-grp{min-height:30px;max-width:100%;padding:2px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:0.7812rem}
.catform .cf-r2{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.catedit .ce-lim{text-align:end;direction:ltr;font-variant-numeric:tabular-nums}
.catedit .btn.sure{min-height:40px;padding-inline:12px;font-size:0.8125rem}
.catform{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;margin-top:16px}
.catform .err{grid-column:1/-1;margin:0;min-height:0}
.catform #cLim{text-align:end;direction:ltr}
.qf{display:grid;gap:10px}
.qf .r1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.qf .r2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.qf .err{min-height:0;margin:0}
.tot{margin:16px 2px 4px;align-items:center}
.limitrow .nm{font-weight:600}
.limitrow .nm small{display:block;font-weight:400;font-size:0.7812rem;color:var(--muted)}
.limitrow .inp{min-height:40px;text-align:end;direction:ltr;font-variant-numeric:tabular-nums}
.limitrow .meter{grid-column:1/-1}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;padding-top:8px;font-size:0.875rem;color:var(--muted);border-top:2px solid var(--line)}
.ghead b{color:var(--ink);font-family:var(--f-display);font-size:1rem}
.ghead:first-of-type{border-top:0;margin-top:0;padding-top:0}

.remrow{display:flex;align-items:center;gap:10px;width:100%;margin-top:8px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:start;min-width:0}
.remrow svg{width:20px;height:20px;flex:none}
.remrow .rr-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.remrow .rr-t b{font-weight:600}
.remnotes{margin-top:0;margin-bottom:12px}
.rembills{margin-top:6px}
.rembills .rb{padding:10px 0;border-top:1px solid var(--line)}
.rembills .rb:first-child{border-top:0}
.rembills .rb b{display:block;margin-bottom:6px;font-weight:600}
.rembills .pill{display:inline-flex;align-items:center;min-height:36px;padding:4px 12px;font-size:0.8438rem;text-decoration:none;color:var(--ink)}
.sheet .sub{font-size:0.8438rem;color:var(--muted);margin:0 0 12px}
.sheet h4{font-family:var(--f-display);font-size:1rem;margin:18px 0 4px}
.plansum{margin-top:12px}
.plansum .over{border:2px solid var(--ink)}
.plansum .over small{color:var(--ink);font-weight:700}
.steps{counter-reset:st}
.step h2{display:flex;align-items:center;gap:10px}
.step h2::before{counter-increment:st;content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-size:0.875rem;font-weight:700;display:grid;place-items:center}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.plancard{text-align:start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:3px;min-height:68px;min-width:0}

.plancard small{font-size:0.7812rem;color:var(--muted);line-height:1.4}
.plancard[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plancard[aria-pressed="true"] small{color:inherit;opacity:.85}
.ghead2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:18px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.ghead2 b{font-family:var(--f-display);font-size:1rem}
.ghead2 .n{font-size:0.8125rem}
.crow{padding-block:12px;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:0}
.cr-top{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:10px;align-items:center;margin-bottom:8px}
.cr-name{text-align:start;min-height:40px;min-width:0;overflow-wrap:anywhere}
.cr-name b{font-weight:600;border-bottom:1px dashed var(--muted)}
.cr-lim{min-height:40px;text-align:end;direction:ltr;font-variant-numeric:tabular-nums}
.cr-meta{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
.cr-edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px;padding:12px;border-radius:10px;background:var(--surface2)}

.cr-acts{grid-column:1/-1;display:flex;gap:10px}
.cr-acts .btn{flex:1;min-height:40px}
.cf-title{grid-column:1/-1;font-family:var(--f-display);font-weight:700}
/* plan: minimal */
.ps{margin-top:26px}
.ps:first-child,.banner+.ps{margin-top:12px}
.lbl{font-size:0.8125rem;font-weight:700;color:var(--muted);margin-bottom:10px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lname{text-align:start;min-height:42px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.lname small{font-weight:600;font-size:0.7812rem}
.lname small.bad{text-decoration:underline}
.lrow .lim{min-height:42px;text-align:end;direction:ltr;font-variant-numeric:tabular-nums}
.lx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px;margin-bottom:6px;border-radius:10px;background:var(--surface2)}
.lx .inp{background:var(--surface)}
.lx-acts{grid-column:1/-1;display:flex;gap:10px}
.lx-acts .btn{flex:1;min-height:40px}
.ltotal{display:flex;justify-content:space-between;gap:10px;margin-top:10px;padding-top:12px;border-top:2px solid var(--ink);font-weight:700}
.addlink{display:inline-flex;align-items:center;gap:6px;margin-top:14px;min-height:40px;font-weight:600;color:var(--accent)}
.addlink svg{width:16px;height:16px}
.dataps{padding-top:16px;border-top:1px solid var(--line)}
.acc{padding:0;overflow:hidden}
.acc-h{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:12px 16px;font-family:var(--f-display);font-weight:700;font-size:1.0625rem;text-align:start}
.acc-h svg{width:20px;height:20px;flex:none;color:var(--muted);transition:transform .2s}
.acc-h[aria-expanded="true"] svg{transform:rotate(180deg)}
.acc-b{padding:0 16px 14px;border-top:1px solid var(--line)}
.acc-b[hidden]{display:none}
.srow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:0.9062rem}
.srow .sl{color:var(--muted);display:flex;flex-direction:column;gap:1px}
.srow .sl small{font-size:0.7812rem}
.srow .n.m{font-size:1.0625rem;font-weight:700}
.sumb{display:grid;gap:18px;padding-top:4px}
.sumb .sg{display:grid}
.sumb .sg+.sg{border-top:1px solid var(--line);padding-top:16px}
.sumb .sh{font-size:0.75rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.sumb .sbig{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:8px}
.sumb .sbig>span{color:var(--muted);font-size:0.875rem}
.sumb .sbig .n.m{font-size:1.75rem;font-weight:700;line-height:1.2}
.sumb .sr{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 0;font-size:0.9375rem}
.sumb .sr>span{color:var(--muted)}
.sumb .sr small{font-size:0.75rem;color:var(--muted)}
.sumb .sr .n.m,.sumb .sr .n{font-size:1rem;font-weight:600}
.sumb .sp-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sumb .sp-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.sumb .sp-name b{font-size:1.0625rem}
.sumb .sp-main .n.m{font-size:1.25rem;font-weight:700;flex:none}
.tb{padding-top:12px;display:flex;flex-direction:column;gap:6px}
.tb .tl{font-size:0.7812rem;color:var(--muted)}
.tb .sp-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.tb .sp-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.tb .sp-name b{font-size:1.125rem}
.tb .n.m{font-size:1.3125rem;font-weight:700;flex:none}
@media (prefers-reduced-motion:reduce){.acc-h svg{transition:none}}
.acc-v{margin-inline-start:auto;font-family:var(--f-body);font-weight:600;font-size:0.875rem;color:var(--muted)}
.plist{display:flex;flex-direction:column}

.popt .pn{display:flex;flex-direction:column;gap:2px;min-width:0}
.popt .pn b{font-size:1rem}
.popt .pn small{font-size:0.8125rem;color:var(--muted)}
.popt .pn .pd{font-size:0.7812rem}
.popt .pc{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center}
.popt.on .pc{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ---------- calculations ---------- */
function calc(ym){
  var income=(+S.salary||0)+(+S.extra||0);
  var cats={};S.cats.forEach(function(c){cats[c.id]={fixed:0,subs:0,vari:0,total:0};});
  cats._none={fixed:0,subs:0,vari:0,total:0};
  var slot=function(id){return Object.prototype.hasOwnProperty.call(cats,id)&&id!=="_none"?cats[id]:cats._none;};
  S.bills.forEach(function(b){slot(b.cat).fixed+=b.amount;});
  S.subs.forEach(function(x){if(x.active)slot(x.cat).subs+=subMonthly(x);});
  (S.meters||[]).forEach(function(m){m.charges.forEach(function(c){if(c.date.slice(0,7)===ym)slot(m.cat).fixed+=c.amount;});});
  S.tx.forEach(function(x){if(x.date.slice(0,7)===ym)slot(x.cat).vari+=x.amount;});
  var spent=0;
  Object.keys(cats).forEach(function(k){var x=cats[k];x.total=x.fixed+x.subs+x.vari;spent+=x.total;});
  return {income:income,cats:cats,spent:spent,remaining:income-spent};
}

function exportBackup(){
  var payload={app:"dafter-albeit",v:1,exportedAt:new Date().toISOString(),state:S};
  var txt=JSON.stringify(payload,null,1),name="dafter-backup-"+todayISO+".json";
  var done=function(){S.lastBackup=todayISO;touch();U.bkMsg={ok:true,t:t("bkDone")};render();};
  var fail=function(e){if(e&&e.code==="declined")return;U.bkMsg={ok:false,t:t("bkFail")};U.tab="plan";render();};
  var viaLink=function(){
    try{
      var bl=new Blob([txt],{type:"application/json"}),u=URL.createObjectURL(bl),a=document.createElement("a");
      a.href=u;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},4000);done();
    }catch(e){fail(e);}
  };
  if(window.claude&&window.claude.use){
    window.claude.use("downloads").then(function(d){if(!d){viaLink();return;}d.save({filename:name,data:txt}).then(done,fail);},function(){viaLink();});
  }else viaLink();
}
function readBackup(file){
  if(!file)return;
  var bad=function(){U.bkPend=null;U.bkMsg={ok:false,t:t("bkBad")};render();};
  if(file.size>5*1024*1024)return bad();
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(String(r.result)),st=(o&&o.app==="dafter-albeit"&&o.state&&typeof o.state==="object")?o.state:null;
      if(!st||!Array.isArray(st.cats))return bad();
      var nz=normalize(st),at=String(o.exportedAt||"").slice(0,10);
      nz.lastBackup=/^\d{4}-\d{2}-\d{2}$/.test(at)?at:"";
      U.bkPend={st:nz};U.bkMsg=null;render();
    }catch(e){bad();}
  };
  r.onerror=bad;r.readAsText(file);
}

function saveMeter(form){
  var sh=U.sheet,fd=new FormData(form),err=$("#fErr"),it=findItem(sh);
  var type=PP_TYPES.indexOf(String(fd.get("type")))>=0?String(fd.get("type")):"electricity";
  var name=String(fd.get("name")||"").trim().slice(0,60),cat=String(fd.get("cat")||"");
  var tname=type==="custom"?String(fd.get("tname")||"").trim().slice(0,40):"";
  if(type==="custom"&&!tname){err.textContent=t("eName");return;}
  var da=parseNum(fd.get("defamt"));if(!(da>0))da=0;
  var wn=parseNum(fd.get("warn"));if(isNaN(wn))wn=3;wn=Math.round(wn);
  if(wn<0||wn>30){err.textContent=t("eWarn");return;}
  if(it){it.type=type;it.typeName=tname;it.name=name;it.cat=cat;it.defAmt=da;it.warn=wn;}
  else{
    var m={id:uid(),type:type,typeName:tname,name:name,cat:cat,defAmt:da,warn:wn,charges:[]};
    var amt=parseNum(fd.get("amount")),date=String(fd.get("date")||"");
    if(amt>0){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent=t("eDate");return;}
      m.charges.push({id:uid(),date:date,amount:amt});
    }
    if(!S.meters)S.meters=[];
    S.meters.push(m);
  }
  touch();closeSheet();render();
}

  if(!(amount>0)){err.textContent=t("eAmount");return;}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent=t("eDate");return;}
  var c=sh.cid?m.charges.filter(function(x){return x.id===sh.cid;})[0]:null;

function saveSheet(form){
  if(U.sheet.kind==="meter")return saveMeter(form);
  if(U.sheet.kind==="charge")return saveCharge(form);
  var sh=U.sheet,fd=new FormData(form),err=$("#fErr");
  var fail=function(m){err.textContent=m;};
  var amount=parseNum(fd.get("amount"));
  if(!(amount>0))return fail(t("eAmount"));
  var it=findItem(sh);
  if(sh.kind==="bill"||sh.kind==="sub"){
    var name=String(fd.get("name")||"").trim();
    if(!name)return fail(t("eName"));
    var day=parseNum(fd.get("day"));if(isNaN(day))day=1;
    if(day<1||day>31||Math.floor(day)!==day)return fail(t("eDay"));
    var renamed=!it||name!==nm(it);
    if(sh.kind==="bill"){
      if(it){if(renamed){it.name=name;it.sk="";}it.amount=amount;it.day=day;it.cat=String(fd.get("cat")||"");}
      else S.bills.push({id:uid(),sk:"",name:name,amount:amount,day:day,cat:String(fd.get("cat")||""),paid:{}});
    }else{
      var cy=fd.get("cycle")==="yearly"?"yearly":"monthly";
      if(it){if(renamed){it.name=name;it.sk="";}it.amount=amount;it.cycle=cy;it.day=day;it.cat=String(fd.get("cat")||"");}
      else S.subs.push({id:uid(),sk:"",name:name,cat:String(fd.get("cat")||""),amount:amount,cycle:cy,day:day,active:true,paid:{}});
    }
  }else{
    var date=String(fd.get("date")||"");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return fail(t("eDate"));
    var note=String(fd.get("note")||"").trim();
    var pc=resolveTxCat(fd);if(pc.err)return fail(pc.err);
    if(it){
      it.amount=amount;it.cat=pc.id;it.sk=pc.sk;it.date=date;
      it.memo=String(fd.get("memo")||"").trim().slice(0,200);
    }else S.tx.push({id:uid(),sk:pc.sk,amount:amount,cat:pc.id,note:note,memo:String(fd.get("memo")||"").trim().slice(0,200),date:date});
    U.ym=date.slice(0,7);
  }
  touch();closeSheet();render();
}
function deleteSheetItem(){
  var sh=U.sheet,keep=function(x){return x.id!==sh.id;};
  if(sh.kind==="charge"){var cm=meterById(sh.id);if(cm)cm.charges=cm.charges.filter(function(c){return c.id!==sh.cid;});}
  else if(sh.kind==="meter")S.meters=(S.meters||[]).filter(keep);
  else if(sh.kind==="bill")S.bills=S.bills.filter(keep);
  else if(sh.kind==="sub")S.subs=S.subs.filter(keep);
  else S.tx=S.tx.filter(keep);
  touch();closeSheet();render();
}

    case "mprev":U.ym=shiftYM(U.ym,-1);render();break;
    case "mnext":U.ym=shiftYM(U.ym,1);render();break;
    case "paid":
      var b=S.bills.filter(function(x){return x.id===id;})[0];
      if(b){if(b.paid[U.ym])delete b.paid[U.ym];else b.paid[U.ym]=paidStamp(b,U.ym);touch();render();}
      break;
    case "sub-paid":

      break;
    case "pbox-toggle":

    case "cat-mgr-done":keepAmt();U.catMgr=false;U.catDel=null;render();break;

    case "add-meter":openSheet("meter");break;
    case "edit-meter":openSheet("meter",id);break;

    case "add-cat-open":U.addCat=true;render();var cn0=$("#cName");if(cn0)cn0.focus();break;

      if(U.confirmCat===id){S.cats=S.cats.filter(function(x){return x.id!==id;});U.confirmCat=null;U.editCat=null;applyPlan();touch();}

document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="sheetForm"){saveSheet(e.target);}
  else if(e.target.id==="quickForm"){
    var fd=new FormData(e.target),err=$("#qErr"),manual=e.target.getAttribute("data-mode")==="manual";
    var amount=parseNum(fd.get("amount")),date=String(fd.get("date")||"");
    if(!(amount>0)){err.textContent=t("eAmount");return;}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent=t("eDate");return;}
    if(manual){
      var what="";
      var pv=String(fd.get("cat")||""),pcid="";
      if(pv==="__new"){
        var pnew=String(fd.get("catnew")||"").trim();
        if(!pnew){err.textContent=t("eName");return;}
        pcid=catByNameOrNew(pnew);U.lastPick="c:"+pcid;
      }else if(pv.indexOf("t:")===0&&TPL_KEYS.indexOf(pv.slice(2))>=0){
        pcid=ensureCatSk(TPL_CAT[pv.slice(2)]);U.lastPick=pv;
      }else if(pv.indexOf("c:")===0&&catById(pv.slice(2))){
        pcid=pv.slice(2);U.lastPick=pv;
      }else{err.textContent=t("eTpl");return;}
      S.tx.push({id:uid(),sk:(pv.indexOf("t:")===0?pv.slice(2):""),amount:amount,cat:pcid,note:"",memo:String(fd.get("memo")||"").trim().slice(0,200),date:date});
    }else{
      if(!U.tpl||TPL_KEYS.indexOf(U.tpl)<0){err.textContent=t("eTpl");return;}
      S.tx.push({id:uid(),sk:U.tpl,amount:amount,cat:ensureCatSk(TPL_CAT[U.tpl]),note:"",date:date});
    }
    U.ym=date.slice(0,7);
    touch();render();
    var q=$("#qAmount");if(q)q.focus({preventScroll:true});
    var ok=$("#qErr");
    if(ok){ok.textContent=t("spAdded",{a:n(amount)});ok.className="err ok";setTimeout(function(){var o=$("#qErr");if(o&&o.className==="err ok"){o.textContent="";o.className="err";}},2200);}
  }else if(e.target.id==="catForm"){
    var cf=new FormData(e.target),ce=$("#cErr"),cn=String(cf.get("name")||"").trim();
    if(!cn){ce.textContent=t("eName");return;}
    var lv=parseNum(cf.get("limit"));if(!(lv>0))lv=0;
    var gv=String(cf.get("g")||"");if(GROUPS.indexOf(gv)<0)gv="needs";
    S.cats.push({id:uid(),sk:"",name:cn,g:gv,limit:Math.round(lv)});
    if(lv>0)S.plan="free";else applyPlan();
    U.addCat=true;touch();render();
    var q2=$("#cName");if(q2)q2.focus();
  }
});
document.addEventListener("keydown",function(e){
  var el=e.target;
  if(e.key==="Enter"&&el&&el.id==="catAddName"){e.preventDefault();doCatAdd();return;}
  if(e.key==="Enter"&&el&&el.dataset&&el.dataset.catren!==undefined){e.preventDefault();el.blur();return;}
  if(e.key==="Enter"&&el&&el.dataset&&el.dataset.inc){
    e.preventDefault();
    var nx=el.id==="salary"?$("#extra"):null;
    if(nx)nx.focus();else el.blur();

});
document.addEventListener("focusout",function(e){
  var el=e.target;
  if(!(el&&el.dataset&&el.dataset.inc)||!U.incEdit)return;
  setTimeout(function(){var a=document.activeElement;if(U.incEdit&&!(a&&a.dataset&&a.dataset.inc)&&S.salary>0){U.incEdit=false;render();}},60);
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(!el.dataset)return;
  if(el.dataset.impfile!==undefined){readBackup(el.files&&el.files[0]);return;}
  if(el.dataset.tplpick){U.tpl=el.value||null;return;}
  if(el.dataset.pptype!==undefined){var tw=$("#f_tname_w");if(tw){tw.hidden=el.value!=="custom";if(!tw.hidden){var tn=$("#f_tname");if(tn)tn.focus();}}return;}
  if(el.dataset.catpick){var ni=el.form&&el.form.querySelector('[name="catnew"]');if(ni){ni.hidden=el.value!=="__new";if(!ni.hidden)ni.focus();}return;}
  if(el.dataset.remtime){
    if(/^([01]\d|2[0-3]):[0-5]\d$/.test(el.value)){S.remind.time=el.value;touch();renderSheet();render();}
  }else if(el.dataset.inc){
    var v=parseNum(el.value);S[el.dataset.inc]=v>=0?v:0;
    applyPlan();touch();
    setTimeout(function(){var a=document.activeElement;if(!(a&&a.dataset&&a.dataset.inc)){if(S.salary>0)U.incEdit=false;render();}},0);
  }else if(el.dataset.catren){
    doCatRename(el.dataset.catren,el.value);
    setTimeout(function(){var a=document.activeElement;if(!(a&&a.dataset&&a.dataset.catren)){keepAmt();render();}},0);
  }else if(el.dataset.limit){
    var k=catById(el.dataset.limit);
    if(k){var l=parseNum(el.value);k.limit=l>=0?Math.round(l):0;S.plan="free";touch();}
    render();
  }else if(el.dataset.catgrp){
    var k3=catById(el.dataset.catgrp);
    if(k3&&GROUPS.indexOf(el.value)>=0){k3.g=el.value;applyPlan();touch();}
    render();
  }else if(el.dataset.catname){
    var k2=catById(el.dataset.catname),nv=String(el.value||"").trim();
    if(k2&&nv&&nv!==cname(k2)){k2.name=nv;k2.sk="";touch();}
    render();
  }
});

/* ---------- chart tooltip ---------- */
var tipEl=document.createElement("div");tipEl.className="ctip";tipEl.hidden=true;tipEl.setAttribute("role","status");document.body.appendChild(tipEl);
function tipShow(x,y,title,rows){
  tipEl.textContent="";
  var tt=document.createElement("div");tt.className="tt";tt.textContent=title;tipEl.appendChild(tt);
  rows.forEach(function(r){
    var d=document.createElement("div");d.className="tr";
    var l=document.createElement("span");l.textContent=r[0];
    var v=document.createElement("span");v.className="n m";v.textContent=n(r[1]);
    d.appendChild(l);d.appendChild(v);tipEl.appendChild(d);
  });
  tipEl.hidden=false;
  var w=tipEl.offsetWidth,h=tipEl.offsetHeight,vw=document.documentElement.clientWidth;
  var left=Math.min(Math.max(8,x-w/2),vw-w-8),top=y-h-14;if(top<8)top=y+18;
  tipEl.style.left=left+"px";tipEl.style.top=top+"px";
}
function tipHide(){tipEl.hidden=true;}
function cumAt(d,cx,cy){
  if(!CH)return;
  d=Math.max(1,Math.min(CH.last,d));
  var svg=$("#cumSvg");if(!svg)return;
  var xh=$("#cumXh"),hd=$("#cumHd");
  xh.setAttribute("x1",CH.X(d));xh.setAttribute("x2",CH.X(d));xh.setAttribute("visibility","visible");
  hd.setAttribute("cx",CH.X(d));hd.setAttribute("cy",CH.Y(CH.cum[d]));hd.setAttribute("visibility","visible");
  var r=svg.getBoundingClientRect(),px=r.left+CH.X(d)/CH.W*r.width,py=r.top+CH.Y(CH.cum[d])/CH.H*r.height;
  var rows=[[t("stCum"),CH.cum[d]]];
  if(CH.fx[d]>0)rows.push([t("stFixed"),CH.fx[d]]);
  if(CH.vr[d]>0)rows.push([t("stVari"),CH.vr[d]]);
  if(CH.budget>0)rows.push([t("stBudget"),Math.round(CH.budget)]);
  tipShow(px,py,t("dayN",{d:d}),rows);
  CH.i=d;
}
function cumHide(){var xh=$("#cumXh"),hd=$("#cumHd");if(xh)xh.setAttribute("visibility","hidden");if(hd)hd.setAttribute("visibility","hidden");tipHide();}
document.addEventListener("pointermove",function(e){
  var hit=e.target.closest&&e.target.closest("#cumHit");
  if(hit&&CH){
    var svg=$("#cumSvg"),r=svg.getBoundingClientRect(),rel=(e.clientX-r.left)/r.width*CH.W;
    cumAt(Math.round((rel-CH.pl)/CH.pw*(CH.D-1))+1);return;
  }
  if(CH&&$("#cumXh")&&$("#cumXh").getAttribute("visibility")==="visible"&&!(e.target.closest&&e.target.closest("#cumSvg")))cumHide();
  var el=e.target.closest&&e.target.closest("[data-tip]");
  if(el){try{var a=JSON.parse(el.getAttribute("data-tip"));tipShow(e.clientX,e.clientY,a[0],a[1]);}catch(x){}}
  else if(!hit)tipHide();
});
document.addEventListener("keydown",function(e){
  if(e.target&&e.target.id==="cumSvg"&&CH&&(e.key==="ArrowRight"||e.key==="ArrowLeft")){
    e.preventDefault();cumAt((CH.i||CH.last)+(e.key==="ArrowRight"?1:-1));
  }
});
document.addEventListener("focusout",function(e){if(e.target&&e.target.id==="cumSvg")cumHide();});
window.addEventListener("scroll",tipHide,{passive:true});


applyTheme();
applyLang();
})();
